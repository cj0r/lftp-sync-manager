<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Arrow 1 Gradient: flows from Cyan to Purple -->
    <linearGradient id="arrow1Grad" x1="60%" y1="10%" x2="60%" y2="90%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <!-- Arrow 2 Gradient: flows from Cyan to Purple -->
    <linearGradient id="arrow2Grad" x1="40%" y1="90%" x2="40%" y2="10%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Sync Arrow 1 (Flowing Clockwise) -->
  <path d="M 309.83 55.09 A 208.0 208.0 0 0 1 360.0 436.13 L 366.5 447.39 L 306.47 444.36 L 340.5 402.36 L 347.0 413.62 A 182.0 182.0 0 0 0 303.11 80.2 Z" fill="url(#arrow1Grad)" />
  
  <!-- Sync Arrow 2 (Flowing Clockwise) -->
  <path d="M 202.17 456.91 A 208.0 208.0 0 0 1 152.0 75.87 L 145.5 64.61 L 205.53 67.64 L 171.5 109.64 L 165.0 98.38 A 182.0 182.0 0 0 0 208.89 431.8 Z" fill="url(#arrow2Grad)" />
  
  <!-- Stylized Folder in Center -->
  <path d="M165,200 L225,200 L245,230 L335,230 C344,230 352,238 352,247 L352,323 C352,332 344,340 335,340 L177,340 C168,340 160,332 160,323 L160,207 C160,200 160,200 165,200 Z" 
        fill="none" stroke="#f3f4f6" stroke-width="16" stroke-linejoin="round" />

  <!-- Document Line inside Folder (Success Green highlight) -->
  <line x1="195" y1="265" x2="315" y2="265" stroke="#10b981" stroke-width="10" stroke-linecap="round" />
  <line x1="195" y1="295" x2="275" y2="295" stroke="#10b981" stroke-width="10" stroke-linecap="round" />
</svg>
