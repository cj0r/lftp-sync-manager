services:
  lftp-sync-manager:
    image: cj0r/lftp-sync-manager:latest
    container_name: lftp-sync-manager
    restart: unless-stopped
    # Reaps orphaned lftp/ssh helper processes. The image already runs under
    # tini, so this is only a safety net for older images.
    init: true
    ports:
      - "9342:9342"
    volumes:
      # Persistent configuration, logs, and transfer history
      - /path/to/local/config:/config
      # Local Upload Folder containing files to upload/push
      - /path/to/local/upload:/local-push
      # Local Download Folder where files will be downloaded/pulled
      - /path/to/local/download:/local-pull
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
