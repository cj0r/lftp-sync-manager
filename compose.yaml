services:
  lftp-sync-manager:
    build: .
    container_name: lftp-sync-manager
    restart: unless-stopped
    ports:
      - "9342:9342"
    volumes:
      # Persistent configuration, logs, and transfer history
      - /mnt/user/appdata/lftp-sync-manager:/config
      # Local Upload Folder containing files to upload/push
      - /mnt/user/appdata/lftp-sync-manager/upload:/local-push
      # Local Download Folder where files will be downloaded/pulled
      - /mnt/user/appdata/lftp-sync-manager/download:/local-pull
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
