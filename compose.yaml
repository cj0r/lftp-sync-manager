services:
  lftp-sync-manager:
    image: cj0r/lftp-sync-manager:latest
    container_name: lftp-sync-manager
    restart: unless-stopped
    # Reaps orphaned lftp/ssh helper processes. The image already runs under
    # tini, so this is only a safety net for older images.
    init: true
    security_opt:
      - no-new-privileges:true
    # Hard cap on processes in the container. If syncs ever pile up again, new
    # ones fail with a clear "out of process slots" error instead of eating
    # the host's kernel resources. A sync uses about Segments x Parallel Files
    # ssh processes per direction (16 x 2 = 32 by default), so allow at least
    # 2 x that plus ~30. Raise it if you raise those settings.
    pids_limit: 256
    # ssh's private key copy and known_hosts live here at runtime, in memory
    # rather than on the /config share. Optional; without it they sit in the
    # container's own filesystem instead.
    tmpfs:
      - /run/lftp:mode=0700
    # Optional, see the README's Security section:
    # environment:
    #   - TRUST_PROXY=loopback, linklocal, uniquelocal   # which proxies may set X-Forwarded-*
    #   - ALLOW_REMOTE_WITHOUT_AUTH=false                # true only if sign-in happens in front of it
    #   - SYNC_MAX_RUNTIME_MINUTES=240                   # stop a sync running longer than this (0 = never)
    ports:
      - "9342:9342"
    volumes:
      # Persistent configuration, logs, and transfer history
      - /path/to/local/config:/config
      # Local Upload Folder containing files to upload/push
      - /path/to/local/upload:/local-push
      # Local Download Folder where files will be downloaded/pulled
      - /path/to/local/download:/local-pull
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
