# Keeps the Node base image, npm dependencies (pnpm lockfile) and the workflow
# actions current. Pull requests target `development`, the default branch,
# like any other change.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    ignore:
      # Stay on Node's LTS line. Odd majors (25, 27) are short-lived "Current"
      # releases; move to the next LTS (26) by hand once it's in Active LTS.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
