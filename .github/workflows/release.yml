name: Release and Sync

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'

jobs:
  release-and-sync:
    if: github.repository == 'cj0r/lftp-sync-manager-private'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker Tags and Target Branch
        id: prep
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "tags=${{ secrets.DOCKERHUB_USERNAME }}/lftp-sync-manager:${VERSION}" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "target_branch=development" >> $GITHUB_OUTPUT
            echo "sync_to_public=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/production ]]; then
            echo "tags=${{ secrets.DOCKERHUB_USERNAME }}/lftp-sync-manager:latest" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "target_branch=production" >> $GITHUB_OUTPUT
            echo "sync_to_public=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/development ]]; then
            echo "tags=${{ secrets.DOCKERHUB_USERNAME }}/lftp-sync-manager:development" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "target_branch=development" >> $GITHUB_OUTPUT
            echo "sync_to_public=true" >> $GITHUB_OUTPUT
          else
            # Generic feature branch build
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            # Replace invalid docker tag characters with hyphens
            SANITIZED_BRANCH=$(echo "${BRANCH_NAME}" | sed 's/[^a-zA-Z0-9_.-]/-/g')
            echo "tags=${{ secrets.DOCKERHUB_USERNAME }}/lftp-sync-manager:${SANITIZED_BRANCH}" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "target_branch=" >> $GITHUB_OUTPUT
            echo "sync_to_public=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.prep.outputs.tags }}

      - name: Sync Public Repository
        if: steps.prep.outputs.sync_to_public == 'true'
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git remote rm public || true
          git remote add public "https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/cj0r/lftp-sync-manager.git"
          
          # Push the active HEAD commit to target branch on the public repository
          git push public HEAD:refs/heads/${{ steps.prep.outputs.target_branch }} --force
          
          # If it is a version tag release, also sync tags
          if [ "${{ steps.prep.outputs.is_tag }}" = "true" ]; then
            git push public --tags --force
          fi
