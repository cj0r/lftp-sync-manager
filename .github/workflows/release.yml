name: Release and Sync

# Builds and publishes the Docker image, and mirrors to the public repo
# (cj0r/lftp-sync-manager):
#
#   tag v1.2.3          -> cj0r/lftp-sync-manager:1.2.3 and :latest, mirrored to
#                          public `production` + the tag. This is the release.
#   push to development -> :development, mirrored to public `development`
#   push to a *.beta branch, or "Run workflow" on any branch
#                       -> :<branch-name>, not mirrored
#
# There is no production branch in this repo: a version tag on `development`
# is what ships. A tag must match package.json and be on development's
# history. An older version tagged later (a hotfix for an old line) gets its
# own image tag but never moves :latest or public `production` backwards.
#
# Every image is smoke-tested (it must start and answer its health endpoint)
# before anything is pushed.
on:
  push:
    tags: ['v*']
    branches: [development, '*.beta']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: cj0r/lftp-sync-manager

jobs:
  release-and-sync:
    if: github.repository == 'cj0r/lftp-sync-manager-private'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Ref names come from whoever pushed them and may contain shell syntax, so
      # they're only ever read from environment variables, never pasted into
      # the script with ${{ }}.
      - name: Determine Docker Tags and Target Branch
        id: prep
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            VERSION="${REF_NAME#v}"
            PKG_VERSION="$(node -p 'require("./package.json").version')"
            if [[ "$VERSION" != "$PKG_VERSION" ]]; then
              echo "::error::Tag $REF_NAME but package.json says $PKG_VERSION"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/development; then
              echo "::error::$REF_NAME isn't on development. Push development first, then the tag."
              exit 1
            fi
            # Only the newest version moves :latest and public production.
            NEWEST="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)"
            {
              echo "tags<<EOF"
              echo "${IMAGE}:${VERSION}"
              if [[ "$NEWEST" == "$REF_NAME" ]]; then echo "${IMAGE}:latest"; fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            if [[ "$NEWEST" == "$REF_NAME" ]]; then
              echo "target_branch=production" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::$REF_NAME is older than $NEWEST, so :latest and public production stay where they are."
              echo "target_branch=" >> "$GITHUB_OUTPUT"
            fi
            echo "sync_to_public=true" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == refs/heads/development && "$GITHUB_EVENT_NAME" == push ]]; then
            echo "tags=${IMAGE}:development" >> "$GITHUB_OUTPUT"
            echo "version=development" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "target_branch=development" >> "$GITHUB_OUTPUT"
            echo "sync_to_public=true" >> "$GITHUB_OUTPUT"
          else
            # Beta branch or a manual run: tag the image with the branch name,
            # with characters Docker tags can't hold replaced by hyphens.
            SANITIZED_BRANCH="$(printf '%s' "$REF_NAME" | sed 's/[^a-zA-Z0-9_.-]/-/g')"
            echo "tags=${IMAGE}:${SANITIZED_BRANCH}" >> "$GITHUB_OUTPUT"
            echo "version=${SANITIZED_BRANCH}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "target_branch=" >> "$GITHUB_OUTPUT"
            echo "sync_to_public=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the amd64 image to test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: lftp-sync-manager:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test it before anything is pushed
        run: |
          docker run -d --name lsm -p 9342:9342 lftp-sync-manager:test
          for _ in $(seq 30); do
            curl -fs http://127.0.0.1:9342/api/auth/status && exit 0
            sleep 2
          done
          docker logs lsm; exit 1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          build-args: |
            VERSION=${{ steps.prep.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync Public Repository
        if: steps.prep.outputs.sync_to_public == 'true'
        env:
          # Private half of a deploy key with write access on the public repo
          # only (unlike a personal access token, it can't reach any other
          # repo). The repo's ruleset lets deploy keys bypass its force-push
          # protection, since mirroring rewrites the public branches.
          PUBLIC_REPO_DEPLOY_KEY: ${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}
          TARGET_BRANCH: ${{ steps.prep.outputs.target_branch }}
          IS_TAG: ${{ steps.prep.outputs.is_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$PUBLIC_REPO_DEPLOY_KEY" > "$key_dir/key"
          chmod 600 "$key_dir/key"
          # GitHub's SSH host keys, fetched over HTTPS rather than trusted on first use
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$key_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $key_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$key_dir/known_hosts -o StrictHostKeyChecking=yes"

          git remote rm public || true
          git remote add public "git@github.com:cj0r/lftp-sync-manager.git"

          # Push the released (or development) commit to the public branch
          if [ -n "$TARGET_BRANCH" ]; then
            git push public "HEAD:refs/heads/${TARGET_BRANCH}" --force
          fi

          # For a version tag, publish just that tag (never rewrite older ones)
          if [ "$IS_TAG" = "true" ]; then
            git push public "refs/tags/${REF_NAME}"
          fi
