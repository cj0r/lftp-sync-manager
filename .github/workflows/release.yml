name: Release and Sync

# Builds and publishes the Docker image, and mirrors the branch to the public
# repo (cj0r/lftp-sync-manager):
#
#   tag v1.2.3          -> cj0r/lftp-sync-manager:1.2.3, mirrored to public `development` + the tag
#   push to production  -> :latest, mirrored to public `production`
#   push to development -> :development, mirrored to public `development`
#   push to a *.beta branch, or "Run workflow" on any branch
#                       -> :<branch-name>, not mirrored
#
# Other branches no longer publish an image on every push; use "Run workflow"
# on the Actions tab to build one on demand.
#
# Every image is smoke-tested (it must start and answer its health endpoint)
# before anything is pushed.
on:
  push:
    tags: ['v*']
    branches: [production, development, '*.beta']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: cj0r/lftp-sync-manager

jobs:
  release-and-sync:
    if: github.repository == 'cj0r/lftp-sync-manager-private'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Ref names come from whoever pushed them and may contain shell syntax, so
      # they're only ever read from environment variables, never pasted into
      # the script with ${{ }}.
      - name: Determine Docker Tags and Target Branch
        id: prep
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            VERSION="${REF_NAME#v}"
            PKG_VERSION="$(node -p 'require("./package.json").version')"
            if [[ "$VERSION" != "$PKG_VERSION" ]]; then
              echo "::error::Tag $REF_NAME but package.json says $PKG_VERSION"
              exit 1
            fi
            echo "tag=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            echo "target_branch=development" >> "$GITHUB_OUTPUT"
            echo "sync_to_public=true" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == refs/heads/production && "$GITHUB_EVENT_NAME" == push ]]; then
            echo "tag=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "version=latest" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "target_branch=production" >> "$GITHUB_OUTPUT"
            echo "sync_to_public=true" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == refs/heads/development && "$GITHUB_EVENT_NAME" == push ]]; then
            echo "tag=${IMAGE}:development" >> "$GITHUB_OUTPUT"
            echo "version=development" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "target_branch=development" >> "$GITHUB_OUTPUT"
            echo "sync_to_public=true" >> "$GITHUB_OUTPUT"
          else
            # Beta branch or a manual run: tag the image with the branch name,
            # with characters Docker tags can't hold replaced by hyphens.
            SANITIZED_BRANCH="$(printf '%s' "$REF_NAME" | sed 's/[^a-zA-Z0-9_.-]/-/g')"
            echo "tag=${IMAGE}:${SANITIZED_BRANCH}" >> "$GITHUB_OUTPUT"
            echo "version=${SANITIZED_BRANCH}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "target_branch=" >> "$GITHUB_OUTPUT"
            echo "sync_to_public=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the amd64 image to test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: lftp-sync-manager:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test it before anything is pushed
        run: |
          docker run -d --name lsm -p 9342:9342 lftp-sync-manager:test
          for _ in $(seq 30); do
            curl -fs http://127.0.0.1:9342/api/auth/status && exit 0
            sleep 2
          done
          docker logs lsm; exit 1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.prep.outputs.tag }}
          build-args: |
            VERSION=${{ steps.prep.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync Public Repository
        if: steps.prep.outputs.sync_to_public == 'true'
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          TARGET_BRANCH: ${{ steps.prep.outputs.target_branch }}
          IS_TAG: ${{ steps.prep.outputs.is_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote rm public || true
          git remote add public "https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/cj0r/lftp-sync-manager.git"

          # Push the active HEAD commit to target branch on the public repository
          git push public "HEAD:refs/heads/${TARGET_BRANCH}" --force

          # For a version tag, publish just that tag (never rewrite older ones)
          if [ "$IS_TAG" = "true" ]; then
            git push public "refs/tags/${REF_NAME}"
          fi
